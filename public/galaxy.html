<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Waymaker - Galaxy View</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- LOAD DATA FIRST (Robust Pattern) -->
    <script src="./waymaker-data.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            overflow: hidden;
            color: white;
        }

        canvas {
            display: block;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Spaceship HUD Animations */
        @keyframes scan {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(200%);
            }
        }

        .animate-scan {
            animation: scan 3s linear infinite;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-down {
            animation: fadeInDown 1s ease-out forwards;
        }

        /* Custom Clip Path for HUD Shape */
        /* .clip-path-spaceship {
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% 85%, 
                85% 100%, 
                0 100%, 
                0 15%
            );
        } */
        /* Using Tailwind border radius instead for smoother look, but keeping ID for ref */
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        try {
            const { useState, useEffect, useRef } = React;

            // Use Global Data, Fallback to empty array if missing
            const waymakerNodes = window.WAYMAKER_DATA || [];

            // --- ICONS ---
            const RefreshIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v6h-6" /><path d="M2.5 22v-6h6" /><path d="M2.5 13.5a10 10 0 1 1 14.9 4.3" /><path d="M21.5 10.5a10 10 0 1 1-14.9-4.3" /></svg>;
            const ChevronRightIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
            const ChevronDownIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;

            // --- CANVAS COMPONENT ---
            const WaymakerCanvas = ({ selectedTag, onNodeClick }) => {
                const canvasRef = useRef(null);

                useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;

                    let animationFrameId;
                    let rotation = 0;
                    let mouseX = 0;
                    let mouseY = 0;
                    let hoveredNode = null;

                    const handleMouseMove = (e) => {
                        const rect = canvas.getBoundingClientRect();
                        mouseX = e.clientX - rect.left;
                        mouseY = e.clientY - rect.top;
                    };

                    const handleClick = () => {
                        if (hoveredNode) {
                            onNodeClick(hoveredNode);
                        }
                    };

                    canvas.addEventListener('mousemove', handleMouseMove);
                    canvas.addEventListener('click', handleClick);

                    const resize = () => {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                    };
                    window.addEventListener('resize', resize);
                    resize();

                    const links = [];
                    waymakerNodes.forEach((n1, i) => {
                        waymakerNodes.slice(i + 1).forEach(n2 => {
                            const shared = n1.tags.filter(t => n2.tags.includes(t));
                            if (shared.length > 0) {
                                links.push({ source: n1, target: n2 });
                            }
                        });
                    });

                    const render = () => {
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;
                        rotation += 0.002;

                        hoveredNode = null;

                        const project = (x, y, z) => {
                            const cos = Math.cos(rotation);
                            const sin = Math.sin(rotation);
                            const rotX = x * cos - z * sin;
                            const rotZ = x * sin + z * cos;
                            const scale = 800 / (800 + rotZ * 10);
                            return {
                                x: centerX + rotX * 10 * scale,
                                y: centerY + y * 10 * scale,
                                scale: scale,
                                isVisible: scale > 0
                            };
                        };

                        links.forEach(link => {
                            const isHighlighted = selectedTag
                                ? (link.source.tags.includes(selectedTag) && link.target.tags.includes(selectedTag))
                                : false;

                            if (selectedTag && !isHighlighted) return;

                            const p1 = project(link.source.x, link.source.y, link.source.z);
                            const p2 = project(link.target.x, link.target.y, link.target.z);

                            if (!p1.isVisible || !p2.isVisible) return;

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);

                            if (isHighlighted) {
                                ctx.strokeStyle = 'rgba(96, 165, 250, 0.8)';
                                ctx.lineWidth = 2;
                            } else {
                                ctx.strokeStyle = 'rgba(59, 130, 246, 0.1)';
                                ctx.lineWidth = 0.5;
                            }
                            ctx.stroke();
                        });

                        waymakerNodes.forEach(node => {
                            const p = project(node.x, node.y, node.z);
                            if (!p.isVisible) return;

                            const isSelected = selectedTag ? node.tags.includes(selectedTag) : true;
                            const isHovered = Math.abs(p.x - mouseX) < 20 && Math.abs(p.y - mouseY) < 20;

                            if (isHovered) {
                                hoveredNode = node;
                                canvas.style.cursor = 'pointer';
                            }

                            const size = ((isSelected ? 4 : 2) + (isHovered ? 3 : 0)) * p.scale;

                            ctx.beginPath();
                            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                            ctx.fillStyle = isSelected || isHovered ? '#60a5fa' : '#475569';
                            ctx.fill();

                            if (p.scale > 0.8 || isSelected || isHovered) {
                                ctx.fillStyle = isSelected || isHovered ? 'white' : 'rgba(255,255,255,0.5)';
                                ctx.font = isSelected || isHovered ? 'bold 12px sans-serif' : '10px sans-serif';
                                ctx.fillText(node.student || "", p.x + 12, p.y + 4);
                            }
                        });

                        if (!hoveredNode) {
                            canvas.style.cursor = 'default';
                        }

                        animationFrameId = requestAnimationFrame(render);
                    };

                    animationFrameId = requestAnimationFrame(render);

                    return () => {
                        cancelAnimationFrame(animationFrameId);
                        window.removeEventListener('resize', resize);
                        canvas.removeEventListener('mousemove', handleMouseMove);
                        canvas.removeEventListener('click', handleClick);
                    };
                }, [selectedTag, onNodeClick]);

                return <canvas ref={canvasRef} className="fixed inset-0 z-0" />;
            };

            // --- NAV COMPONENT ---
            const CategoryNav = ({ nodes, selectedTag, onTagSelect }) => {
                const [openCategories, setOpenCategories] = useState({});

                // Group tags by category
                const categories = nodes.reduce((acc, node) => {
                    const cat = node.category || "Uncategorized";
                    if (!acc[cat]) acc[cat] = new Set();
                    node.tags.forEach(t => acc[cat].add(t));
                    return acc;
                }, {});

                useEffect(() => {
                    if (selectedTag) {
                        const foundEntry = Object.entries(categories).find(([_, tags]) => tags.has(selectedTag));
                        if (foundEntry) {
                            setOpenCategories(prev => ({ ...prev, [foundEntry[0]]: true }));
                        }
                    }
                }, [selectedTag]);

                const toggleCategory = (cat) => {
                    setOpenCategories(prev => ({ ...prev, [cat]: !prev[cat] }));
                };

                return (
                    <div className="flex flex-col items-end gap-2 w-full">
                        {Object.entries(categories).map(([category, tagsSet]) => {
                            const tags = Array.from(tagsSet);
                            const isOpen = openCategories[category];
                            const hasActiveTag = tags.includes(selectedTag);

                            return (
                                <div key={category} className="flex flex-col items-end w-full">
                                    <button
                                        onClick={() => toggleCategory(category)}
                                        className={`
                                            flex items-center justify-end gap-2 px-4 py-2 rounded-l-full
                                            transition-all duration-300 border-r-4 w-48 backdrop-blur-md mb-1
                                            ${hasActiveTag
                                                ? 'bg-blue-900/40 border-blue-400 text-blue-100'
                                                : 'bg-slate-900/60 border-slate-700 text-slate-300 hover:bg-slate-800/80 hover:w-52'}
                                        `}
                                    >
                                        <span className="text-xs font-bold uppercase tracking-wider">{category}</span>
                                        {isOpen ? <ChevronDownIcon /> : <ChevronRightIcon />}
                                    </button>

                                    <div className={`
                                        overflow-hidden transition-all duration-500 ease-in-out flex flex-col items-end gap-1
                                        ${isOpen ? 'max-h-[500px] opacity-100 mb-3' : 'max-h-0 opacity-0'}
                                    `}>
                                        {tags.map(tag => (
                                            <button
                                                key={tag}
                                                onClick={() => onTagSelect(selectedTag === tag ? null : tag)}
                                                className={`
                                                    text-xs px-3 py-1.5 rounded-l-full transition-all duration-200 border-r-2
                                                    flex items-center justify-end gap-2 w-auto min-w-[100px] hover:pr-4
                                                    ${selectedTag === tag
                                                        ? 'bg-blue-500 text-white border-white shadow-[0_0_15px_rgba(59,130,246,0.5)] translate-x-0'
                                                        : 'bg-transparent text-slate-400 border-slate-700/50 hover:bg-slate-800 hover:text-blue-200 hover:border-blue-400/50'}
                                                `}
                                            >
                                                {tag.replace('#', '')}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            // --- APP ---
            const App = () => {
                const [selectedTag, setSelectedTag] = useState(null);

                const handleNodeClick = (node) => {
                    window.location.href = `view.html?id=${node.id}`;
                };

                if (waymakerNodes.length === 0) {
                    return <div className="p-10 text-center text-red-500 font-bold">Error: Data failed to load. Please check waymaker-data.js</div>;
                }

                return (
                    <div className="relative min-h-screen text-white overflow-hidden bg-slate-900 font-sans">
                        <WaymakerCanvas selectedTag={selectedTag} onNodeClick={handleNodeClick} />
                        <div className="relative z-10 container mx-auto px-4 py-10 min-h-screen flex flex-col pointer-events-none">
                            {/* Spaceship HUD Title Panel (Top Left) */}
                            <div className="fixed top-6 left-6 z-30 max-w-md animate-fade-in-down pointer-events-auto">
                                {/* Decorative HUD Elements */}
                                <div className="absolute -top-2 -left-2 w-8 h-8 border-t-2 border-l-2 border-blue-400 opacity-50"></div>
                                <div className="absolute -bottom-2 -right-2 w-8 h-8 border-b-2 border-r-2 border-blue-400 opacity-50"></div>

                                <div className="relative overflow-hidden bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 shadow-[0_0_30px_rgba(59,130,246,0.2)] p-6 rounded-br-3xl rounded-tl-lg clip-path-spaceship">
                                    {/* Scanner Line Animation */}
                                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50 animate-scan"></div>

                                    <div className="flex items-center gap-2 mb-3">
                                        <div className="h-2 w-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_10px_red]"></div>
                                        <span className="text-[10px] uppercase tracking-[0.2em] text-blue-300 font-mono">System Online</span>
                                    </div>

                                    <h1 className="text-4xl md:text-5xl font-black italic tracking-tighter text-white mb-2 leading-none" style={{ textShadow: "0 0 20px rgba(59, 130, 246, 0.5)" }}>
                                        SPACE
                                        <span className="block text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">WAYMAKER</span>
                                    </h1>

                                    <p className="text-sm text-slate-400 font-light leading-relaxed border-l-2 border-blue-500/30 pl-3 mt-4">
                                        <span className="text-white font-medium">스페이스 웨이메이커</span>에 오신 것을 환영합니다.<br />
                                        아이들의 생각이 연결된 거대한 은하계를 탐험하세요.
                                    </p>

                                    <div className="mt-4 flex gap-2">
                                        <div className="px-2 py-1 bg-blue-500/20 rounded text-[9px] text-blue-300 font-mono border border-blue-500/30">
                                            NODES: {waymakerNodes.length}
                                        </div>
                                        <div className="px-2 py-1 bg-purple-500/20 rounded text-[9px] text-purple-300 font-mono border border-purple-500/30">
                                            STATUS: ACTIVE
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="fixed right-8 bottom-8 z-30 flex flex-col gap-2 items-end pointer-events-auto transition-all duration-700 delay-300 transform-none max-h-[70vh] overflow-y-auto pr-2 scrollbar-hide">
                                <div className="text-[10px] text-slate-500 font-mono mb-2 uppercase tracking-widest bg-slate-900/80 px-2 py-1 rounded backdrop-blur border border-slate-800 self-end">
                                    Waymaker Archive
                                </div>
                                <button
                                    onClick={() => setSelectedTag(null)}
                                    className={`px-4 py-2 rounded-l-full text-xs font-medium transition-all duration-300 border-r-4 backdrop-blur-md w-32 text-right mb-4 ${selectedTag === null
                                        ? 'bg-white text-slate-900 border-blue-500 shadow-[0_0_20px_rgba(255,255,255,0.4)] translate-x-2'
                                        : 'bg-slate-900/60 text-slate-400 border-slate-700 hover:border-slate-500 hover:bg-slate-800/80 hover:w-36'
                                        }`}
                                >
                                    전체 보기 (Reset)
                                </button>
                                <CategoryNav
                                    nodes={waymakerNodes}
                                    selectedTag={selectedTag}
                                    onTagSelect={setSelectedTag}
                                />
                            </div>
                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);

        } catch (err) {
            console.error(err);
            document.body.innerHTML = `<div style="color:red; padding:20px;"><h1>Critical Error</h1><pre>${err.message}</pre></div>`;
        }
    </script>
</body>

</html>
