<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Waymaker - Galaxy View</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- LOAD DATA (Cache Busted) -->
    <script>
        document.write('<script src="./waymaker-data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>

    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            overflow: hidden;
            color: white;
        }

        canvas {
            display: block;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Spaceship HUD Animations */
        @keyframes scan {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(200%);
            }
        }

        .animate-scan {
            animation: scan 3s linear infinite;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-down {
            animation: fadeInDown 1s ease-out forwards;
        }

        /* Custom Clip Path for HUD Shape */
        /* .clip-path-spaceship {
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% 85%, 
                85% 100%, 
                0 100%, 
                0 15%
            );
        } */
        /* Using Tailwind border radius instead for smoother look, but keeping ID for ref */
    </style>
</head>

<body>
    <!-- EMERGENCY HOME BUTTON SCRIPT -->
    <script>
        (function () {
            // Function to create and append the button
            function createHomeButton() {
                // Check if button already exists to prevent duplicates
                if (document.getElementById('emergency-home-btn')) return;

                const btn = document.createElement('a');
                btn.id = 'emergency-home-btn';
                btn.href = '/';
                btn.title = 'Main Base';

                // Premium Glassmorphism Styling (Restored)
                btn.style.cssText = `
                    position: fixed !important;
                    top: 24px !important;
                    right: 24px !important;
                    width: 50px !important;
                    height: 50px !important;
                    background-color: rgba(15, 23, 42, 0.8) !important; /* Slate 900 with opacity */
                    backdrop-filter: blur(12px) !important;
                    -webkit-backdrop-filter: blur(12px) !important;
                    border: 1px solid rgba(51, 65, 85, 0.5) !important; /* Slate 700 */
                    border-radius: 50% !important;
                    z-index: 2147483647 !important; /* Max Z-Index */
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    box-shadow: 0 0 20px rgba(59, 130, 246, 0.3) !important; /* Blue glow */
                    cursor: pointer !important;
                    text-decoration: none !important;
                    transition: all 0.3s ease !important;
                `;

                // Hover effects
                btn.onmouseenter = () => {
                    btn.style.transform = 'scale(1.1)';
                    btn.style.borderColor = 'rgba(96, 165, 250, 1)'; /* Blue 400 */
                    btn.style.boxShadow = '0 0 30px rgba(34, 211, 238, 0.5)'; /* Cyan glow */
                };
                btn.onmouseleave = () => {
                    btn.style.transform = 'scale(1)';
                    btn.style.borderColor = 'rgba(51, 65, 85, 0.5)';
                    btn.style.boxShadow = '0 0 20px rgba(59, 130, 246, 0.3)';
                };

                btn.innerHTML = `
                    <div style="position: absolute; inset: 0; background: rgba(59, 130, 246, 0.1); border-radius: 50%;"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: relative; z-index: 10;">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    <div style="position: absolute; top: 110%; right: 0; background: rgba(0,0,0,0.8); color: #bfdbfe; font-size: 10px; padding: 4px 8px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap;" id="home-tooltip">
                        Main Base
                    </div>
                `;

                // Tooltip visibility
                btn.onmouseover = () => {
                    const tip = btn.querySelector('#home-tooltip');
                    if (tip) tip.style.opacity = '1';
                }
                btn.onmouseout = () => {
                    const tip = btn.querySelector('#home-tooltip');
                    if (tip) tip.style.opacity = '0';
                }

                document.body.appendChild(btn);
                console.log("Emergency Home Button added to DOM");
            }

            // Run immediately
            createHomeButton();

            // Run again after window load
            window.addEventListener('load', createHomeButton);

            // Run periodically
            setInterval(createHomeButton, 1000);
        })();
    </script>

    <div id="root"></div>

    <script type="text/babel">
        try {
            const { useState, useEffect, useRef } = React;

            // Use Global Data, Fallback to empty array if missing
            const waymakerNodes = window.WAYMAKER_DATA || [];

            // --- ICONS ---
            const RefreshIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v6h-6" /><path d="M2.5 22v-6h6" /><path d="M2.5 13.5a10 10 0 1 1 14.9 4.3" /><path d="M21.5 10.5a10 10 0 1 1-14.9-4.3" /></svg>;
            const ChevronRightIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
            const ChevronDownIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
            const HomeIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>;

            // --- CANVAS COMPONENT ---
            const WaymakerCanvas = ({ selectedTag, onNodeClick }) => {
                const canvasRef = useRef(null);

                useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;

                    let animationFrameId;
                    let rotation = 0;
                    let mouseX = 0;
                    let mouseY = 0;
                    let hoveredNode = null;

                    const handleMouseMove = (e) => {
                        const rect = canvas.getBoundingClientRect();
                        mouseX = e.clientX - rect.left;
                        mouseY = e.clientY - rect.top;
                    };

                    const handleClick = () => {
                        if (hoveredNode) {
                            onNodeClick(hoveredNode);
                        }
                    };

                    canvas.addEventListener('mousemove', handleMouseMove);
                    canvas.addEventListener('click', handleClick);

                    const resize = () => {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                    };
                    window.addEventListener('resize', resize);
                    resize();

                    const links = [];
                    waymakerNodes.forEach((n1, i) => {
                        waymakerNodes.slice(i + 1).forEach(n2 => {
                            const shared = n1.tags.filter(t => n2.tags.includes(t));
                            if (shared.length > 0) {
                                links.push({ source: n1, target: n2 });
                            }
                        });
                    });

                    const render = () => {
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;
                        rotation += 0.002;

                        hoveredNode = null;

                        const project = (x, y, z) => {
                            const cos = Math.cos(rotation);
                            const sin = Math.sin(rotation);
                            const rotX = x * cos - z * sin;
                            const rotZ = x * sin + z * cos;
                            const scale = 800 / (800 + rotZ * 10);
                            return {
                                x: centerX + rotX * 10 * scale,
                                y: centerY + y * 10 * scale,
                                scale: scale,
                                isVisible: scale > 0
                            };
                        };

                        links.forEach(link => {
                            const isHighlighted = selectedTag
                                ? (link.source.tags.includes(selectedTag) && link.target.tags.includes(selectedTag))
                                : false;

                            if (selectedTag && !isHighlighted) return;

                            const p1 = project(link.source.x, link.source.y, link.source.z);
                            const p2 = project(link.target.x, link.target.y, link.target.z);

                            if (!p1.isVisible || !p2.isVisible) return;

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);

                            if (isHighlighted) {
                                ctx.strokeStyle = 'rgba(96, 165, 250, 0.8)';
                                ctx.lineWidth = 2;
                            } else {
                                ctx.strokeStyle = 'rgba(59, 130, 246, 0.1)';
                                ctx.lineWidth = 0.5;
                            }
                            ctx.stroke();
                        });

                        waymakerNodes.forEach(node => {
                            const p = project(node.x, node.y, node.z);
                            if (!p.isVisible) return;

                            const isSelected = selectedTag ? node.tags.includes(selectedTag) : true;
                            const isHovered = Math.abs(p.x - mouseX) < 20 && Math.abs(p.y - mouseY) < 20;

                            if (isHovered) {
                                hoveredNode = node;
                                canvas.style.cursor = 'pointer';
                            }

                            // --- RENDERING NODE ---
                            const baseSize = ((isSelected ? 4 : 2) + (isHovered ? 3 : 0)) * p.scale;

                            // 1. SPACESHIP RENDERING
                            if (node.type === 'spaceship') {
                                const shipSize = baseSize * 2.5; // Make ships visible
                                const shipColor = isSelected || isHovered ? '#22d3ee' : '#0e7490'; // Cyan-400 / Cyan-700
                                const shipGlow = 'rgba(34, 211, 238, 0.6)';

                                ctx.save();
                                ctx.translate(p.x, p.y);
                                ctx.fillStyle = shipColor;
                                ctx.strokeStyle = '#67e8f9'; // Cyan-200
                                ctx.lineWidth = p.scale; // Scale stroke

                                ctx.beginPath();
                                const s = shipSize;
                                switch (node.shipType || 1) {
                                    case 1: // Delta Wing
                                        ctx.moveTo(0, -s);
                                        ctx.lineTo(s * 0.8, s);
                                        ctx.lineTo(0, s * 0.7); // Indent
                                        ctx.lineTo(-s * 0.8, s);
                                        ctx.closePath();
                                        break;
                                    case 2: // Saucer
                                        ctx.ellipse(0, 0, s, s * 0.4, 0, 0, Math.PI * 2);
                                        // Dome
                                        ctx.moveTo(s * 0.5, -s * 0.1);
                                        ctx.arc(0, -s * 0.1, s * 0.5, Math.PI, 0);
                                        break;
                                    case 3: // Retro Rocket
                                        ctx.moveTo(0, -s * 1.2);
                                        ctx.quadraticCurveTo(s * 0.6, -s * 0.5, s * 0.6, s * 0.8);
                                        ctx.lineTo(-s * 0.6, s * 0.8);
                                        ctx.quadraticCurveTo(-s * 0.6, -s * 0.5, 0, -s * 1.2);
                                        // Fins
                                        ctx.moveTo(-s * 0.6, s * 0.8);
                                        ctx.lineTo(-s, s * 1.2);
                                        ctx.lineTo(-s * 0.6, s * 0.5);
                                        ctx.moveTo(s * 0.6, s * 0.8);
                                        ctx.lineTo(s, s * 1.2);
                                        ctx.lineTo(s * 0.6, s * 0.5);
                                        break;
                                    case 4: // Diamond Explorer
                                        ctx.moveTo(0, -s);
                                        ctx.lineTo(s * 0.7, 0);
                                        ctx.lineTo(0, s);
                                        ctx.lineTo(-s * 0.7, 0);
                                        ctx.closePath();
                                        // Center core
                                        ctx.rect(-s * 0.2, -s * 0.2, s * 0.4, s * 0.4);
                                        break;
                                    default:
                                        ctx.arc(0, 0, s, 0, Math.PI * 2);
                                }

                                if (isSelected || isHovered) {
                                    ctx.shadowBlur = 15;
                                    ctx.shadowColor = shipGlow;
                                    ctx.stroke();
                                }
                                ctx.fill();
                                ctx.restore();

                                // Label for Ship
                                if (p.scale > 0.8 || isSelected || isHovered) {
                                    ctx.fillStyle = '#67e8f9'; // Light Cyan
                                    ctx.font = isSelected || isHovered ? 'bold 12px sans-serif' : '10px sans-serif';
                                    ctx.shadowBlur = 0;
                                    ctx.fillText("🛸 " + (node.student || "Explorer"), p.x + 12, p.y + 4);
                                }


                            } else if (node.type === 'satellite') {
                                // 3. SATELLITE RENDERING
                                const targetNode = waymakerNodes.find(n => n.id === node.orbitTarget);

                                // Orbit Logic (Only if target exists)
                                if (targetNode) {
                                    const time = Date.now() * 0.001;
                                    const orbitRadius = 60;
                                    const orbitSpeed = 0.5;
                                    const orbitX = Math.cos(time * orbitSpeed) * orbitRadius;
                                    const orbitZ = Math.sin(time * orbitSpeed) * orbitRadius;

                                    // Visual Override (Temporary mutation for rendering frame)
                                    node.x = targetNode.x + orbitX;
                                    node.y = targetNode.y + (Math.sin(time * 0.3) * 10);
                                    node.z = targetNode.z + orbitZ;
                                } else {
                                    // Fallback: If no target, just float in place (Self-orbit)
                                    const time = Date.now() * 0.001;
                                    node.y += Math.sin(time) * 0.1; // Gentle bob
                                }

                                // Re-project with (potentially new) coordinates
                                const searchP = project(node.x, node.y, node.z);
                                p.x = searchP.x;
                                p.y = searchP.y;
                                p.scale = searchP.scale;
                                p.isVisible = searchP.isVisible;

                                if (p.isVisible) {
                                    ctx.save();
                                    ctx.translate(p.x, p.y);

                                    // Satellite Icon
                                    const satSize = baseSize * 2;
                                    ctx.strokeStyle = isSelected || isHovered ? '#a78bfa' : '#8b5cf6'; // Violet
                                    ctx.fillStyle = '#1e1b4b'; // Dark Violet
                                    ctx.lineWidth = 1.5 * p.scale;

                                    // Solar Panels (Left & Right)
                                    ctx.beginPath();
                                    ctx.rect(-satSize * 1.5, -satSize * 0.4, satSize * 1.2, satSize * 0.8);
                                    ctx.rect(satSize * 0.3, -satSize * 0.4, satSize * 1.2, satSize * 0.8);
                                    ctx.fill();
                                    ctx.stroke();

                                    // Main Body (Center)
                                    ctx.beginPath();
                                    ctx.fillStyle = isSelected || isHovered ? '#c4b5fd' : '#8b5cf6';
                                    ctx.rect(-satSize * 0.4, -satSize * 0.5, satSize * 0.8, satSize);
                                    ctx.fill();

                                    // Antenna
                                    ctx.beginPath();
                                    ctx.moveTo(0, satSize * 0.5);
                                    ctx.lineTo(0, satSize);
                                    ctx.arc(0, satSize, satSize * 0.2, 0, Math.PI * 2);
                                    ctx.stroke();

                                    ctx.restore();

                                    // Label for Satellite
                                    if (p.scale > 0.8 || isSelected || isHovered) {
                                        ctx.fillStyle = '#a78bfa'; // Light Violet
                                        ctx.font = isSelected || isHovered ? 'bold 12px sans-serif' : '10px sans-serif';
                                        ctx.shadowBlur = 0;
                                        ctx.fillText("🛰️ " + (node.student || "Satellite"), p.x + 12, p.y + 4);
                                    }
                                }

                            } else {
                                // 2. STANDARD STAR RENDERING
                                let currentSize = baseSize;
                                let color = isSelected || isHovered ? '#60a5fa' : '#475569';
                                let glowColor = 'rgba(96, 165, 250, 0.5)';

                                if (node.isNew) {
                                    // Pulsing effect
                                    const pulse = (Math.sin(Date.now() * 0.005) + 1) / 2; // 0 to 1
                                    currentSize = baseSize * (1.2 + pulse * 0.3); // Pulse size
                                    color = '#fbbf24'; // Amber-400 (Gold)
                                    glowColor = `rgba(251, 191, 36, ${0.4 + pulse * 0.4})`; // Pulsing glow
                                }

                                ctx.beginPath();
                                ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
                                ctx.fillStyle = color;

                                // Glow effect
                                if (isSelected || isHovered || node.isNew) {
                                    ctx.shadowBlur = node.isNew ? 20 : 10;
                                    ctx.shadowColor = glowColor;
                                } else {
                                    ctx.shadowBlur = 0;
                                }

                                ctx.fill();
                                ctx.shadowBlur = 0; // Reset for text

                                // Text Label
                                if (p.scale > 0.8 || isSelected || isHovered || node.isNew) {
                                    ctx.fillStyle = isSelected || isHovered || node.isNew ? 'white' : 'rgba(255,255,255,0.5)';
                                    ctx.font = isSelected || isHovered || node.isNew ? 'bold 12px sans-serif' : '10px sans-serif';

                                    let label = node.student || "";
                                    if (node.isNew) label = "★ " + label; // Add star badge
                                    ctx.fillText(label, p.x + 12, p.y + 4);
                                }
                            }
                        });

                        if (!hoveredNode) {
                            canvas.style.cursor = 'default';
                        }

                        animationFrameId = requestAnimationFrame(render);
                    };

                    animationFrameId = requestAnimationFrame(render);

                    return () => {
                        cancelAnimationFrame(animationFrameId);
                        window.removeEventListener('resize', resize);
                        canvas.removeEventListener('mousemove', handleMouseMove);
                        canvas.removeEventListener('click', handleClick);
                    };
                }, [selectedTag, onNodeClick]);

                return <canvas ref={canvasRef} className="fixed inset-0 z-0" />;
            };

            // --- NAV COMPONENT ---
            const CategoryNav = ({ nodes, selectedTag, onTagSelect }) => {
                const [openCategories, setOpenCategories] = useState({});

                // Group tags by category
                const categories = nodes.reduce((acc, node) => {
                    const cat = node.category || "Uncategorized";
                    if (!acc[cat]) acc[cat] = new Set();
                    node.tags.forEach(t => acc[cat].add(t));
                    return acc;
                }, {});

                useEffect(() => {
                    if (selectedTag) {
                        const foundEntry = Object.entries(categories).find(([_, tags]) => tags.has(selectedTag));
                        if (foundEntry) {
                            setOpenCategories(prev => ({ ...prev, [foundEntry[0]]: true }));
                        }
                    }
                }, [selectedTag]);

                const toggleCategory = (cat) => {
                    setOpenCategories(prev => ({ ...prev, [cat]: !prev[cat] }));
                };

                return (
                    <div className="flex flex-col items-end gap-2 w-full">
                        {Object.entries(categories).map(([category, tagsSet]) => {
                            const tags = Array.from(tagsSet);
                            const isOpen = openCategories[category];
                            const hasActiveTag = tags.includes(selectedTag);

                            return (
                                <div key={category} className="flex flex-col items-end w-full">
                                    <button
                                        onClick={() => toggleCategory(category)}
                                        className={`
                                            flex items-center justify-end gap-2 px-4 py-2 rounded-l-full
                                            transition-all duration-300 border-r-4 w-48 backdrop-blur-md mb-1
                                            ${hasActiveTag
                                                ? 'bg-blue-900/40 border-blue-400 text-blue-100'
                                                : 'bg-slate-900/60 border-slate-700 text-slate-300 hover:bg-slate-800/80 hover:w-52'}
                                        `}
                                    >
                                        <span className="text-xs font-bold uppercase tracking-wider">{category}</span>
                                        {isOpen ? <ChevronDownIcon /> : <ChevronRightIcon />}
                                    </button>

                                    <div className={`
                                        overflow-hidden transition-all duration-500 ease-in-out flex flex-col items-end gap-1
                                        ${isOpen ? 'max-h-[500px] opacity-100 mb-3' : 'max-h-0 opacity-0'}
                                    `}>
                                        {tags.map(tag => (
                                            <button
                                                key={tag}
                                                onClick={() => onTagSelect(selectedTag === tag ? null : tag)}
                                                className={`
                                                    text-xs px-3 py-1.5 rounded-l-full transition-all duration-200 border-r-2
                                                    flex items-center justify-end gap-2 w-auto min-w-[100px] hover:pr-4
                                                    ${selectedTag === tag
                                                        ? 'bg-blue-500 text-white border-white shadow-[0_0_15px_rgba(59,130,246,0.5)] translate-x-0'
                                                        : 'bg-transparent text-slate-400 border-slate-700/50 hover:bg-slate-800 hover:text-blue-200 hover:border-blue-400/50'}
                                                `}
                                            >
                                                {tag.replace('#', '')}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            // --- APP ---
            const App = () => {
                const [selectedTag, setSelectedTag] = useState(null);

                const handleNodeClick = (node) => {
                    window.location.href = `view.html?id=${node.id}`;
                };

                if (waymakerNodes.length === 0) {
                    return <div className="p-10 text-center text-red-500 font-bold">Error: Data failed to load. Please check waymaker-data.js</div>;
                }

                return (
                    <div className="relative min-h-screen text-white overflow-hidden bg-slate-900 font-sans">
                        <WaymakerCanvas selectedTag={selectedTag} onNodeClick={handleNodeClick} />

                        {/* Home Button (Top Right) - Bulletproof Positioning */}
                        <a href="/" style={{ position: 'fixed', top: '24px', right: '24px', zIndex: 9999 }} className="pointer-events-auto group">
                            <div className="relative overflow-hidden bg-slate-900/80 backdrop-blur-md border border-slate-700/50 p-3 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.3)] transition-all duration-300 group-hover:scale-110 group-hover:border-blue-400 group-hover:shadow-[0_0_30px_rgba(34,211,238,0.5)] text-white">
                                <div className="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                <HomeIcon />
                            </div>
                            <div className="absolute top-full right-0 mt-2 px-2 py-1 bg-black/80 text-[10px] text-blue-200 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none whitespace-nowrap">
                                Main Base
                            </div>
                        </a>



                        <div className="relative z-10 container mx-auto px-4 py-10 min-h-screen flex flex-col pointer-events-none">
                            {/* Spaceship HUD Title Panel (Top Left) */}
                            <div className="fixed top-6 left-6 z-30 max-w-2xl animate-fade-in-down pointer-events-auto hidden md:block">
                                {/* Decorative HUD Elements */}
                                <div className="absolute -top-2 -left-2 w-8 h-8 border-t-2 border-l-2 border-blue-400 opacity-50"></div>
                                <div className="absolute -bottom-2 -right-2 w-8 h-8 border-b-2 border-r-2 border-blue-400 opacity-50"></div>

                                <div className="relative overflow-hidden bg-slate-900/90 backdrop-blur-xl border border-slate-700/50 shadow-[0_0_30px_rgba(59,130,246,0.2)] p-6 rounded-3xl clip-path-spaceship flex items-center gap-8">
                                    {/* Scanner Line Animation */}
                                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50 animate-scan"></div>

                                    {/* LEFT COLUMN: Text Info */}
                                    <div className="flex-1 space-y-4">
                                        <div className="inline-block bg-black/50 border border-blue-500/30 px-3 py-1 rounded text-[10px] font-bold tracking-widest text-blue-400 uppercase">
                                            Mission Control
                                        </div>

                                        <div>
                                            <h1 className="text-4xl font-black italic tracking-tighter text-white leading-none" style={{ textShadow: "0 0 20px rgba(59, 130, 246, 0.5)" }}>
                                                SPACE WAYMAKER
                                            </h1>
                                            <div className="text-sm font-mono text-slate-500 mt-1 uppercase tracking-wider">
                                                The Infinity Loop Protocol
                                            </div>
                                        </div>

                                        <p className="text-xs md:text-sm text-slate-300 font-light leading-relaxed">
                                            <span className="text-white font-medium">스페이스 웨이메이커</span>는 우리 아이들의 생각이 연결된
                                            광활한 지식의 은하계입니다. 각 별들은 고유한 이야기를 담고 있습니다.
                                        </p>

                                        <ul className="space-y-1 text-xs text-slate-400 font-mono">
                                            <li className="flex items-center gap-2">
                                                <div className="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>
                                                Total Nodes: <span className="text-white">{waymakerNodes.length}</span>
                                            </li>
                                            <li className="flex items-center gap-2">
                                                <div className="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                                                System Status: <span className="text-green-400">Operational</span>
                                            </li>
                                        </ul>
                                    </div>

                                    {/* RIGHT COLUMN: Spaceship Schematic */}
                                    <div className="w-32 h-32 flex-shrink-0 relative transform rotate-12 opacity-90 drop-shadow-[0_0_10px_rgba(59,130,246,0.3)]">
                                        {/* Custom SVG schematic */}
                                        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-200 w-full h-full">
                                            {/* Capsule Body */}
                                            <path d="M30 80 L35 90 L65 90 L70 80 L85 50 C90 30 70 10 50 10 C30 10 10 30 15 50 Z" />
                                            {/* Horizontal Rings */}
                                            <path d="M15 50 H 85" opacity="0.8" />
                                            <path d="M22 65 H 78" opacity="0.8" />
                                            {/* Vertical Lines */}
                                            <path d="M50 10 L 50 90" strokeWidth="1" opacity="0.5" />
                                            <path d="M35 15 L 35 50" strokeWidth="1" opacity="0.3" />
                                            <path d="M65 15 L 65 50" strokeWidth="1" opacity="0.3" />
                                            {/* Windows */}
                                            <circle cx="50" cy="35" r="5" fill="rgba(59,130,246,0.2)" stroke="none" />
                                            <circle cx="50" cy="35" r="5" />
                                            {/* Base */}
                                            <path d="M30 80 L 30 85" strokeWidth="1.5" />
                                            <path d="M70 80 L 70 85" strokeWidth="1.5" />
                                        </svg>
                                        <div className="absolute inset-0 bg-blue-500/5 blur-xl rounded-full -z-10"></div>
                                    </div>
                                </div>
                            </div>


                            <div className="fixed right-8 bottom-8 z-30 flex flex-col gap-2 items-end pointer-events-auto transition-all duration-700 delay-300 transform-none max-h-[70vh] overflow-y-auto pr-2 scrollbar-hide">
                                <div className="text-[10px] text-slate-500 font-mono mb-2 uppercase tracking-widest bg-slate-900/80 px-2 py-1 rounded backdrop-blur border border-slate-800 self-end">
                                    Space Waymaker Archive
                                </div>
                                <button
                                    onClick={() => setSelectedTag(null)}
                                    className={`px-4 py-2 rounded-l-full text-xs font-medium transition-all duration-300 border-r-4 backdrop-blur-md w-32 text-right mb-4 ${selectedTag === null
                                        ? 'bg-white text-slate-900 border-blue-500 shadow-[0_0_20px_rgba(255,255,255,0.4)] translate-x-2'
                                        : 'bg-slate-900/60 text-slate-400 border-slate-700 hover:border-slate-500 hover:bg-slate-800/80 hover:w-36'
                                        }`}
                                >
                                    전체 보기 (Reset)
                                </button>
                                <CategoryNav
                                    nodes={waymakerNodes}
                                    selectedTag={selectedTag}
                                    onTagSelect={setSelectedTag}
                                />
                            </div>


                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);

        } catch (err) {
            console.error(err);
            // Modified error handling to NOT wipe the body, allowing our Safe Mode Home Button to survive
            const errDiv = document.createElement('div');
            errDiv.style.color = 'red';
            errDiv.style.padding = '20px';
            errDiv.style.position = 'fixed';
            errDiv.style.bottom = '0';
            errDiv.style.left = '0';
            errDiv.style.zIndex = '999999';
            errDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
            errDiv.innerHTML = `<h1>Critical Error</h1><pre>${err.message}</pre>`;
            document.body.appendChild(errDiv);
        }
    </script>
</body>

</html>
