<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RE:EARTH: The Day Zero Protocol (Master Web Edition)</title>
    <style>
        body {
            background-color: #12151b;
            /* Atmospheric dark mountain background */
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .container {
            width: 90vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .flip-book {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        .page {
            background-color: #fff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1); /* Subtle page shadow */
            border: 1px solid rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Fit exact page aspect */
        }
        .hard {
            background-color: #1a2233 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flip-book" id="flipbook">
            <!-- Pages injected by JS -->
        </div>
    </div>
    
    <!-- StPageFlip core -->
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const vh = window.innerHeight;
            
            // Maintain A4 portrait aspect ratio (210/297 = 0.707)
            const targetHeight = vh * 0.85;
            const targetWidth = targetHeight * 0.707;

            const pageFlip = new St.PageFlip(
                document.getElementById("flipbook"),
                {
                    width: targetWidth, 
                    height: targetHeight,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1414,
                    drawShadow: true,
                    showCover: true,
                    usePortrait: true,
                    maxShadowOpacity: 0.8,
                    flippingTime: 1200 // Luxurious slow flip
                }
            );

            // Dynamically load 78 pages
            const pages = [];
            // Front cover
            pages.push('<div class="page page-cover" data-density="hard"><img src="pages/page_0.jpg"></div>');
            
            // Inner pages
            for (let i = 1; i < 78 - 1; i++) {
                pages.push('<div class="page"><img src="pages/page_' + i + '.jpg"></div>');
            }
            
            // Back cover
            pages.push('<div class="page page-cover" data-density="hard"><img src="pages/page_77.jpg"></div>');
            
            document.getElementById("flipbook").innerHTML = pages.join('');
            
            const pageElements = document.querySelectorAll('.page');
            pageFlip.loadFromHTML(pageElements);
        });
    </script>
</body>
</html>
