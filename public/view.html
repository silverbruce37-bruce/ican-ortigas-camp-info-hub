<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waymaker View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 p-6 z-50">
        <a href="galaxy.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
            <div class="p-2 rounded-full bg-slate-800 border border-slate-700 group-hover:bg-slate-700 transition-all">
                <i data-lucide="chevron-left"></i>
            </div>
            <span class="text-sm font-medium tracking-wide uppercase">Back to Galaxy</span>
        </a>
    </nav>

    <!-- Main Content -->
    <div id="content-container"
        class="flex-1 flex flex-col items-center justify-center p-4 pt-20 animate-fade-in opacity-0 transition-opacity duration-1000">
        <!-- Dynamic Content Will Be Injected Here -->
        <div class="text-slate-500">Loading...</div>
    </div>

    <script type="module">
        import { waymakerNodes } from './waymaker-data.js';

        // Get ID from URL
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('id');

        const container = document.getElementById('content-container');
        const videoData = waymakerNodes.find(n => n.id === videoId);

        // Initialize Lucide Icons
        lucide.createIcons();

        // Reveal animation
        setTimeout(() => container.classList.remove('opacity-0'), 100);

        if (videoData) {
            document.title = `${videoData.title} - Waymaker`;

            container.innerHTML = `
                <div class="w-full max-w-5xl">
                    <!-- Video Section -->
                    <div class="relative w-full aspect-video rounded-3xl overflow-hidden shadow-2xl border border-slate-700/50 bg-black mb-8 group">
                        <iframe 
                            src="https://www.youtube.com/embed/${videoData.videoUrl}?autoplay=1&rel=0" 
                            class="absolute inset-0 w-full h-full"
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>

                    <!-- Info Section -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 px-4">
                        <div class="md:col-span-2 space-y-4">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-bold border border-blue-500/20">
                                    ${videoData.category}
                                </span>
                                <span class="text-slate-500 text-sm font-mono">${videoData.date}</span>
                            </div>
                            <h1 class="text-3xl md:text-5xl font-bold text-white leading-tight">${videoData.title}</h1>
                            <p class="text-lg text-slate-300 leading-relaxed font-light border-l-4 border-blue-500 pl-4 py-1">
                                ${videoData.desc}
                            </p>
                            
                            <div class="flex flex-wrap gap-2 pt-4">
                                ${videoData.tags.map(tag =>
                `<span class="text-sm text-slate-400 bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700">
                                        ${tag}
                                    </span>`
            ).join('')}
                            </div>
                        </div>

                        <div class="md:col-span-1 border-t md:border-t-0 md:border-l border-slate-800 pt-8 md:pt-0 md:pl-8">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xl font-bold text-white shadow-lg">
                                    ${videoData.student.charAt(0)}
                                </div>
                                <div>
                                    <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Created By</div>
                                    <div class="font-bold text-white">${videoData.student}</div>
                                </div>
                            </div>
                            
                            <div class="bg-slate-800/30 rounded-xl p-5 border border-slate-700/50">
                                <h3 class="font-bold text-slate-200 mb-2 flex items-center gap-2">
                                    <i data-lucide="award" class="w-4 h-4 text-yellow-500"></i>
                                    Waymaker Note
                                </h3>
                                <p class="text-sm text-slate-400 leading-relaxed">
                                    이 작품은 ICAN Academy의 미디어 커리큘럼을 통해 제작되었습니다. 학생의 독창적인 시선과 기술적 성장을 응원해주세요.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            // Re-run icons for injected content
            lucide.createIcons();
        } else {
            container.innerHTML = `
                <div class="text-center">
                    <h1 class="text-4xl font-bold text-slate-700 mb-4">Signal Lost</h1>
                    <p class="text-slate-400">해당 영상을 찾을 수 없습니다.</p>
                    <a href="galaxy.html" class="inline-block mt-6 px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition-colors">
                        Return to Galaxy
                    </a>
                </div>
            `;
        }
    </script>
</body>

</html>
