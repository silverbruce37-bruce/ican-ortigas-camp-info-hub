  <title>아이캔 올티가스 캠프 학부모 정보 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;900&display=swap"

    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            display: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            // Apple-inspired palette
            paper: '#F5F5F7', // Main background (light gray)
            card: '#FFFFFF',  // Card background (white)
            ink: '#1D1D1F',   // Primary text (near black)
            secondary: '#86868B', // Secondary text (gray)
            accent: '#0071E3', // Apple Blue
            ican: {
              50: '#F5F5F7',
              100: '#E8E8ED',
              500: '#0071E3', // Rebrand primary to Apple Blue
              600: '#0077ED',
              800: '#1D1D1F',
              900: '#000000',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards', // Smoother cubic-bezier for Apple feel
            'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
