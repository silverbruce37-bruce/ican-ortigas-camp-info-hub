<body class="bg-paper text-ink font-sans antialiased selection:bg-accent selection:text-white">
  <div id="root"></div>

  <!-- GLOBAL HOME BUTTON INJECTION SCRIPT -->
  <script>
      (function () {
        function checkAndAddHomeButton() {
          // Show only if path includes galaxy (HTML or SPA route)
          const isGalaxy = window.location.pathname.includes('galaxy') || window.location.href.includes('galaxy');

          if (isGalaxy) {
            if (document.getElementById('global-home-btn')) return;

            const btn = document.createElement('a');
            btn.id = 'global-home-btn';
            btn.href = '/';
            // Styling to ensure maximum visibility
            btn.style.cssText = `
                position: fixed !important;
                top: 24px !important;
                right: 24px !important;
                z-index: 2147483647 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: 50px !important;
                height: 50px !important;
                background-color: #0f172a !important; /* Dark Slate 900 */
                border: 2px solid #60a5fa !important; /* Blue 400 */
                border-radius: 50% !important;
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.8) !important;
                cursor: pointer !important;
                text-decoration: none !important;
                transition: transform 0.2s !important;
            `;

            // Hover effect via JS
            btn.onmouseover = () => { btn.style.transform = 'scale(1.1)'; btn.style.boxShadow = '0 0 30px rgba(34, 211, 238, 1)'; };
            btn.onmouseout = () => { btn.style.transform = 'scale(1)'; btn.style.boxShadow = '0 0 20px rgba(59, 130, 246, 0.8)'; };

            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            `;

            document.body.appendChild(btn);
          } else {
            // Remove if navigation goes elsewhere
            const existing = document.getElementById('global-home-btn');
            if (existing) existing.remove();
          }
        }

        // Initial check
        checkAndAddHomeButton();
        // Check on history changes (SPA navigation)
        window.addEventListener('popstate', checkAndAddHomeButton);
        // Periodic check for aggressive SPAs
        setInterval(checkAndAddHomeButton, 500);
      })();
  </script>
